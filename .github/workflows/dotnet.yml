name: .NET build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FacturacionAPI.slnx
      - name: Build (Release)
        run: dotnet build FacturacionAPI.slnx --configuration Release --no-restore
      - name: Run tests (Release)
        run: dotnet test FacturacionAPI.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
